<!DOCTYPE html>
<html>
<head>
    <title>AI Driver Drowsiness Detection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        h1 {
            margin-bottom: 10px;
        }

        video {
            width: 640px;
            max-width: 90%;
            border-radius: 10px;
            background: black;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }

        #status {
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>AI Driver Drowsiness Detection</h1>

    <p>Allow camera access to start drowsiness detection.</p>

    <video id="camera" autoplay playsinline></video>

    <br>

    <button onclick="startCamera()">Allow Camera</button>

    <p id="status">Camera not started</p>

    <script>

        async function startCamera() {

            try {

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });

                document.getElementById("camera").srcObject = stream;

                document.getElementById("status").innerText =
                    "Camera started successfully";

            } catch (error) {

                console.error(error);

                document.getElementById("status").innerText =
                    "Camera permission denied or camera unavailable";

            }
        }

    </script>

</body>
</html>
